name: "Build Adam's Corne"
on: workflow_dispatch
# The Corne split over ESB (eg0n/zmk-split-esb), with nice-view-gem on both
# nice!views. Its settings come from the module's conf/, which its local
# scripts/build.sh uses too: conf/<half>.conf for ESB and the Corne's features,
# conf/corne_gem.conf for the screen.
jobs:
  build:
    uses: ./.github/workflows/build-acb.yml
    secrets: inherit
    with:
      board: '["nice_nano//zmk"]'
      shield: '["corne_left nice_view_adapter nice_view_gem","corne_right nice_view_adapter nice_view_gem"]'
      # Rolling WPM, for a smooth WPM gauge and graph.
      branches: '["zmkfirmware/zmk/main eg0n/zmk/feat/wpm-rolling"]'
      # Our nice-view-gem fork shows the right half's link and battery on the left.
      modules: '["eg0n/zmk-split-esb/main eg0n/nice-view-gem/feat/esb-split"]'
      # Quoted: the two conf files are a ;-separated list.
      cmake_args: '"-DEXTRA_CONF_FILE=${MIRYOKU_MODULE_ZMK_SPLIT_ESB}/conf/${MIRYOKU_KEYBOARD}.conf;${MIRYOKU_MODULE_ZMK_SPLIT_ESB}/conf/corne_gem.conf"'
