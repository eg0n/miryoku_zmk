name: "Build Adam's Totem (Prospector screens)"
on: workflow_dispatch
jobs:
  build:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["xiao_ble//zmk"]'
      # Dongle only: the left/right/settings_reset firmware is identical to
      # build-acb-totem, so only the dongle needs reflashing to try these screens.
      shield: '["totem_dongle prospector_adapter"]'
      alphas: '["colemak"]'
      clipboard: '["mac"]'
      extra: '["qwerty"]'
      tap: '["colemak"]'
      branches: '["eg0n/zmk/totem-4.1"]'
      # NOTE: prospector points at a fork. feat/new-status-screens-backlight adds
      # two things on top of carrefinho's branch:
      #   - routes the ambient-light thread through ZMK's backlight subsystem, so
      #     &bl BL_TOG can turn the screen off and idle auto-off works
      #   - a PROSPECTOR_PROVIDE_CAPS_WORD_EVENT switch (below)
      # Push that branch to eg0n/prospector-zmk-module before running this.
      modules: '["eg0n/zmk-totem-dongle/main caksoylar/zmk-rgbled-widget/main eg0n/prospector-zmk-module/feat/new-status-screens-backlight"]'
      # BACKLIGHT_BEHAVIORS binds &bl BL_TOG on the MEDIA layer, the prospector
      # equivalent of DONGLE_SCREEN_BRIGHTNESS_BEHAVIORS' &ds_bl DS_BL_TOG.
      dts_extra_cppflags: '["MIRYOKU_KLUDGE_GLOBALSHIFTFUNCTIONS RGBLED_WIDGET_BEHAVIORS BACKLIGHT_BEHAVIORS"]'
      # PROVIDE_CAPS_WORD_EVENT=n because eg0n/zmk already defines
      # zmk_caps_word_state_changed; leaving both in place collides at link time.
      # Screen layout: swap CLASSIC for RADII / FIELD / OPERATOR.
      kconfig: '["CONFIG_PROSPECTOR_PROVIDE_CAPS_WORD_EVENT=n\nCONFIG_PROSPECTOR_STATUS_SCREEN_CLASSIC=y"]'
      archive_name: 'firmware-prospector'
