name: "Build Adam's Totem (Prospector screens)"
on: workflow_dispatch
jobs:
  # The halves and the settings_reset image do not depend on the dongle screen,
  # so they build once against plain upstream ZMK, exactly as build-acb-totem
  # does. They are included here so one dispatch yields a complete flashable set.
  base:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["xiao_ble//zmk"]'
      shield: '["totem_left rgbled_adapter", "totem_right rgbled_adapter", "settings_reset"]'
      alphas: '["colemak"]'
      clipboard: '["mac"]'
      extra: '["qwerty"]'
      tap: '["colemak"]'
      branches: '["zmkfirmware/zmk/main"]'
      modules: '["eg0n/zmk-totem-dongle/main caksoylar/zmk-rgbled-widget/main"]'
      dts_extra_cppflags: '["MIRYOKU_KLUDGE_GLOBALSHIFTFUNCTIONS RGBLED_WIDGET_BEHAVIORS"]'
      artifact_prefix: 'acb-base'
      merge: false

  # One dongle image per Prospector screen layout: carrefinho's four, plus the
  # Crystal layout from our fork. Everything else about these builds is
  # identical, so the kconfig entries carry a "label|" prefix to keep their
  # output filenames and artifact names distinct.
  dongle:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["xiao_ble//zmk"]'
      shield: '["totem_dongle prospector_adapter"]'
      alphas: '["colemak"]'
      clipboard: '["mac"]'
      extra: '["qwerty"]'
      tap: '["colemak"]'
      branches: '["zmkfirmware/zmk/main"]'
      # Our prospector fork: carrefinho's new-status-screens plus &bl BL_TOG
      # screen-off, a caps-word event switch, the Crystal layout, peripheral
      # status fixes and zmk-split-esb support (inert in BLE builds).
      modules: '["eg0n/zmk-totem-dongle/main caksoylar/zmk-rgbled-widget/main eg0n/prospector-zmk-module/feat/esb-split"]'
      # BACKLIGHT_BEHAVIORS binds &bl BL_TOG on the MEDIA layer, the prospector
      # equivalent of DONGLE_SCREEN_BRIGHTNESS_BEHAVIORS' &ds_bl DS_BL_TOG.
      dts_extra_cppflags: '["MIRYOKU_KLUDGE_GLOBALSHIFTFUNCTIONS RGBLED_WIDGET_BEHAVIORS BACKLIGHT_BEHAVIORS"]'
      # Upstream ZMK has no caps-word event, so prospector supplies its own
      # (PROVIDE_CAPS_WORD_EVENT defaults to y). Set it to n only when building
      # against eg0n/zmk, which defines the same event and would collide.
      kconfig: '[
        "classic|CONFIG_PROSPECTOR_STATUS_SCREEN_CLASSIC=y",
        "radii|CONFIG_PROSPECTOR_STATUS_SCREEN_RADII=y",
        "field|CONFIG_PROSPECTOR_STATUS_SCREEN_FIELD=y",
        "operator|CONFIG_PROSPECTOR_STATUS_SCREEN_OPERATOR=y",
        "crystal|CONFIG_PROSPECTOR_STATUS_SCREEN_CRYSTAL=y"
        ]'
      artifact_prefix: 'acb-dongle'
      merge: false

  # Both calls above leave their artifacts in place; collect all eight here so
  # the run produces a single downloadable archive.
  merge:
    runs-on: ubuntu-latest
    needs: [base, dongle]
    name: Merge Output Artifacts
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v7
        with:
          name: firmware-prospector
          pattern: acb-*
          delete-merged: true
