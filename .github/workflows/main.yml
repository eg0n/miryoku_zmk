# https://github.com/manna-harbour/miryoku

# Builds Miryoku firmware. Each input from board to modules is a JSON list in a string,
# '["default"]' when unset, and one firmware is built for every combination of their values.
# The steps themselves are in scripts/miryoku_build.py.

name: 'Main'
on:
  workflow_call:
    inputs:
      board:
        type: string
        default: '["default"]'
      shield:
        description: "One or more shields, separated by spaces; the first names the keyboard"
        type: string
        default: '["default"]'
      alphas:
        type: string
        default: '["default"]'
      extra:
        type: string
        default: '["default"]'
      tap:
        type: string
        default: '["default"]'
      nav:
        type: string
        default: '["default"]'
      clipboard:
        type: string
        default: '["default"]'
      layers:
        type: string
        default: '["default"]'
      mapping:
        type: string
        default: '["default"]'
      dts_extra_cppflags:
        description: "Defines for the keymap, separated by spaces, e.g. 'RGBLED_WIDGET FOO=BAR'"
        type: string
        default: '["default"]'
      custom_config:
        description: "Lines of '#define NAME' or '#define NAME VALUE', passed on as -D flags like dts_extra_cppflags"
        type: string
        default: '["default"]'
      kconfig:
        description: "Kconfig lines for the keyboard's .conf. A leading 'label|' names the variant in the output files."
        type: string
        default: '["default"]'
      branches:
        description: "ZMK as user/repo/branch, then any branches to merge into it, separated by spaces"
        type: string
        default: '["default"]'
      modules:
        description: "ZMK modules as user/repo/branch, separated by spaces"
        type: string
        default: '["default"]'
      archive_name:
        description: "Archive output file name"
        default: "firmware"
        required: false
        type: string
      artifact_prefix:
        description: "Prefix for the per-build artifacts, and the pattern the merge job collects. Give concurrent calls of this workflow distinct prefixes so their merge jobs do not consume each other's artifacts."
        default: "artifact"
        required: false
        type: string
      merge:
        description: "Merge the per-build artifacts into archive_name. Set false when the calling workflow merges several calls into a single archive itself."
        default: true
        required: false
        type: boolean
      container_image:
        description: "Toolchain image; must match the Zephyr version of the ZMK branch being built"
        default: "zmkfirmware/zmk-build-arm:4.1-branch"
        required: false
        type: string
      cmake_args:
        description: "Extra CMake arguments for every build, written as on a command line. ${MIRYOKU_KEYBOARD} is the build's first shield (or its board), e.g. totem_left, and ${MIRYOKU_MODULE_<REPO>} a module's checkout, e.g. -DEXTRA_CONF_FILE=${MIRYOKU_MODULE_ZMK_SPLIT_ESB}/conf/${MIRYOKU_KEYBOARD}.conf."
        default: ""
        required: false
        type: string

jobs:
  main:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.container_image }}
    strategy:
      fail-fast: false
      matrix:
        board: ${{ fromJSON(inputs.board) }}
        shield: ${{ fromJSON(inputs.shield) }}
        alphas: ${{ fromJSON(inputs.alphas) }}
        extra: ${{ fromJSON(inputs.extra) }}
        tap: ${{ fromJSON(inputs.tap) }}
        nav: ${{ fromJSON(inputs.nav) }}
        clipboard: ${{ fromJSON(inputs.clipboard) }}
        layers: ${{ fromJSON(inputs.layers) }}
        mapping: ${{ fromJSON(inputs.mapping) }}
        dts_extra_cppflags: ${{ fromJSON(inputs.dts_extra_cppflags) }}
        custom_config: ${{ fromJSON(inputs.custom_config) }}
        kconfig: ${{ fromJSON(inputs.kconfig) }}
        branches: ${{ fromJSON(inputs.branches) }}
        modules: ${{ fromJSON(inputs.modules) }}
    env:
      MIRYOKU_DEBUG: ${{ secrets.MIRYOKU_DEBUG }}
      # The script reads this build's matrix entry and the inputs from the environment, so
      # that no value is pasted into shell text.
      MATRIX: ${{ toJSON(matrix) }}
      INPUTS: ${{ toJSON(inputs) }}
      CMAKE_ARGS: ${{ inputs.cmake_args }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          path: 'miryoku_zmk'
      # Works out the build and fetches what it needs: outboards, ZMK and modules.
      - name: prepare
        id: prepare
        run: python3 miryoku_zmk/.github/workflows/scripts/miryoku_build.py prepare
      - name: cache
        uses: actions/cache@v5
        with:
          path: |
            zmk/modules/
            zmk/zephyr/
          key: zephyr ${{ runner.os }} ${{ hashFiles('zmk/app/west.yml') }}
        timeout-minutes: 2
        continue-on-error: true
      # Runs west and leaves the firmware in the artifact directory.
      - name: build
        run: python3 miryoku_zmk/.github/workflows/scripts/miryoku_build.py build
      - name: upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact_prefix }}-${{ steps.prepare.outputs.artifact_name }}
          path: ${{ steps.prepare.outputs.artifact_dir }}
  merge:
    runs-on: ubuntu-latest
    needs: main
    if: ${{ inputs.merge }}
    name: Merge Output Artifacts
    steps:
      - name: Merge Artifacts
        uses: actions/upload-artifact/merge@v7
        with:
          name: ${{ inputs.archive_name }}
          pattern: ${{ inputs.artifact_prefix }}-*
          delete-merged: true
